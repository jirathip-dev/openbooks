name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  binary:
    needs: plan
    if: needs.plan.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: "" }
          - { os: macos-15, target: aarch64-apple-darwin, exe: "" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: cargo build --release --locked -p openbooks-server
      - shell: bash
        run: |
          mkdir dist
          cp "target/release/openbooks-server${{ matrix.exe }}" "dist/openbooks-server-${{ needs.plan.outputs.version }}-${{ matrix.target }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbooks-server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set --
          for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            curl -sfA "openbooks-release (${{ github.server_url }}/${{ github.repository }})" -o /dev/null "https://crates.io/api/v1/crates/$name/$VERSION" || set -- "$@" -p "$name"
          done
          [ "$#" = 0 ] || cargo publish --locked "$@"
      - name: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          npm ci --no-audit --no-fund
          for dir in web packs/*/web; do
            name=$(jq -r .name "$dir/package.json")
            npm view "$name@$VERSION" version > /dev/null 2>&1 || npm publish --workspace "$dir" --access public
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openbooks-server-*
          merge-multiple: true
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target "$SHA" --title "v$VERSION" --generate-notes
