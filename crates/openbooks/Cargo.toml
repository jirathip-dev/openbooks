[package]
name = "openbooks"
version.workspace = true
description = "openbooks: the library a host embeds"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
openbooks-core = { version = "0.1.0", path = "../openbooks-core" }
